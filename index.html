      html,

      /* 3D Glassmorphism Cards */
      .glass-card {
        background: rgba(12, 8, 22, 0.68);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(124, 58, 237, 0.22);
        transition:
          border-color 0.4s ease,
          box-shadow 0.4s ease,
          transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        transform-style: preserve-3d;
      }

      .glass-card:hover {
        border-color: rgba(168, 85, 247, 0.6);
        box-shadow:
          0 20px 40px -10px rgba(124, 58, 237, 0.35),
          0 0 25px rgba(168, 85, 247, 0.2);
      }

      .text-gradient {
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          #e9d5ff 40%,
          #a855f7 80%,
          #7c3aed 100%
        );
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .purple-gradient-btn {
        background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }

      .purple-gradient-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.25),
          transparent
        );
        transition: left 0.6s ease;
      }

      .purple-gradient-btn:hover::before {
        left: 100%;
      }

      .purple-gradient-btn:hover {
        box-shadow: 0 0 30px rgba(168, 85, 247, 0.7);
        transform: translateY(-2px) scale(1.02);
      }

      .purple-gradient-btn:active {
        transform: translateY(0) scale(0.98);
      }

      /* Ambient Cyber Grid Overlay */
      .bg-cyber-grid {
        background-size: 50px 50px;
        background-image:
          linear-gradient(
            to right,
            rgba(124, 58, 237, 0.08) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(124, 58, 237, 0.08) 1px,
            transparent 1px
          );
      }

      /* Animated Aurora Waves */
      @keyframes floatAurora {
        0%,
        100% {
          transform: translate(0px, 0px) scale(1);
        }
        50% {
          transform: translate(30px, -25px) scale(1.1);
        }
      }

      .animate-aurora {
        animation: floatAurora 12s ease-in-out infinite alternate;
      }

      /* Scroll Reveal Utility Classes */
      .reveal-element {
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
          transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .reveal-element.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #040308;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e1738;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #7c3aed;
      }

      const playSoundEffect = (type = "click") => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === "click") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(
              300,
              ctx.currentTime + 0.04,
            );
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
              0.001,
              ctx.currentTime + 0.04,
            );
            osc.start();
            osc.stop(ctx.currentTime + 0.04);
          } else if (type === "hover") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(280, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(
              420,
              ctx.currentTime + 0.03,
            );
            gain.gain.setValueAtTime(0.02, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
              0.001,
              ctx.currentTime + 0.03,
            );
            osc.start();
            osc.stop(ctx.currentTime + 0.03);
          }
        } catch (e) {}
      };

      function DynamicBackgroundCanvas() {
        const canvasRef = React.useRef(null);
        const [mousePos, setMousePos] = React.useState({ x: -500, y: -500 });

        React.useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          let animationFrameId;

          let width = (canvas.width = window.innerWidth);
          let height = (canvas.height = window.innerHeight);

          const handleResize = () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
          };
          window.addEventListener("resize", handleResize);

          const mouse = { x: width / 2, y: height / 2, radius: 220 };
          const handleMouseMove = (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            setMousePos({ x: e.clientX, y: e.clientY });
          };
          window.addEventListener("mousemove", handleMouseMove);

          const codeSymbols = [
            "C++",
            "STL",
            "DP",
            "O(N log N)",
            "BFS",
            "DFS",
            "Tree",
            "Graph",
            "IIUC",
            "0101",
            "Vector",
            "Codeforces",
          ];
          const particleCount = Math.min(Math.floor(width / 14), 95);
          const particles = [];

          for (let i = 0; i < particleCount; i++) {
            particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              vx: (Math.random() - 0.5) * 0.7,
              vy: (Math.random() - 0.5) * 0.7,
              radius: Math.random() * 2.2 + 1,
              alpha: Math.random() * 0.7 + 0.2,
              isSymbol: Math.random() < 0.22,
              symbol:
                codeSymbols[Math.floor(Math.random() * codeSymbols.length)],
              fontSize: Math.floor(Math.random() * 3) + 10,
            });
          }

          // Meteors / Shooting stars effect
          const meteors = Array.from({ length: 5 }, () => ({
            x: Math.random() * width,
            y: Math.random() * (height * 0.6),
            length: Math.random() * 90 + 40,
            speed: Math.random() * 3.5 + 2.5,
            alpha: Math.random() * 0.5 + 0.2,
          }));

          const draw = () => {
            ctx.clearRect(0, 0, width, height);

            // Draw shooting meteors
            meteors.forEach((m) => {
              m.x += m.speed;
              m.y += m.speed * 0.6;
              if (m.x > width || m.y > height) {
                m.x = Math.random() * width * 0.5 - 200;
                m.y = Math.random() * height * 0.3;
              }
              const grad = ctx.createLinearGradient(
                m.x,
                m.y,
                m.x - m.length,
                m.y - m.length * 0.6,
              );
              grad.addColorStop(0, `rgba(168, 85, 247, ${m.alpha})`);
              grad.addColorStop(1, "rgba(168, 85, 247, 0)");
              ctx.beginPath();
              ctx.moveTo(m.x, m.y);
              ctx.lineTo(m.x - m.length, m.y - m.length * 0.6);
              ctx.strokeStyle = grad;
              ctx.lineWidth = 1.5;
              ctx.stroke();
            });

            // Draw particles & floating code symbols
            for (let i = 0; i < particles.length; i++) {
              const p1 = particles[i];

              p1.x += p1.vx;
              p1.y += p1.vy;

              if (p1.x < 0 || p1.x > width) p1.vx *= -1;
              if (p1.y < 0 || p1.y > height) p1.vy *= -1;

              const dxMouse = mouse.x - p1.x;
              const dyMouse = mouse.y - p1.y;
              const distMouse = Math.sqrt(
                dxMouse * dxMouse + dyMouse * dyMouse,
              );

              if (distMouse < mouse.radius) {
                const force = (mouse.radius - distMouse) / mouse.radius;
                p1.x -= (dxMouse / distMouse) * force * 2.5;
                p1.y -= (dyMouse / distMouse) * force * 2.5;

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(mouse.x, mouse.y);
                ctx.strokeStyle = `rgba(168, 85, 247, ${0.4 * (1 - distMouse / mouse.radius)})`;
                ctx.lineWidth = 0.9;
                ctx.stroke();
              }

              if (p1.isSymbol) {
                ctx.font = `${p1.fontSize}px 'Fira Code', monospace`;
                ctx.fillStyle = `rgba(192, 132, 252, ${p1.alpha * 0.85})`;
                ctx.fillText(p1.symbol, p1.x, p1.y);
              } else {
                ctx.beginPath();
                ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(168, 85, 247, ${p1.alpha})`;
                ctx.fill();
              }

              for (let j = i + 1; j < particles.length; j++) {
                const p2 = particles[j];
                const dx = p1.x - p2.x;
                const dy = p1.y - p2.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 125) {
                  ctx.beginPath();
                  ctx.moveTo(p1.x, p1.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.strokeStyle = `rgba(124, 58, 237, ${0.25 * (1 - dist / 125)})`;
                  ctx.lineWidth = 0.8;
                  ctx.stroke();
                }
              }
            }

            animationFrameId = requestAnimationFrame(draw);
          };

          draw();

          return () => {
            window.removeEventListener("resize", handleResize);
            window.removeEventListener("mousemove", handleMouseMove);
            cancelAnimationFrame(animationFrameId);
          };
        }, []);

        return (
          <>
            <canvas
              ref={canvasRef}
              className="fixed inset-0 pointer-events-none z-0 opacity-90"
            />
            <div
              className="fixed inset-0 pointer-events-none z-0 transition-opacity duration-300"
              style={{
                background: `
                                radial-gradient(650px circle at ${mousePos.x}px ${mousePos.y}px, rgba(124, 58, 237, 0.16), transparent 70%),
                                radial-gradient(300px circle at ${mousePos.x}px ${mousePos.y}px, rgba(6, 182, 212, 0.08), transparent 80%)
                            `,
              }}
            />
          </>
        );
      }

      function TiltCard({ children, className = "", soundEnabled = false }) {
        const cardRef = React.useRef(null);
        const [transform, setTransform] = React.useState(
          "perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)",
        );
        const [glarePos, setGlarePos] = React.useState({
          x: 50,
          y: 50,
          opacity: 0,
        });

        const handleMouseMove = (e) => {
          if (!cardRef.current) return;
          const rect = cardRef.current.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          const centerX = rect.width / 2;
          const centerY = rect.height / 2;

          const rotateX = ((y - centerY) / centerY) * -9;
          const rotateY = ((x - centerX) / centerX) * 9;

          setTransform(
            `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) scale3d(1.02, 1.02, 1.02)`,
          );
          setGlarePos({
            x: (x / rect.width) * 100,
            y: (y / rect.height) * 100,
            opacity: 0.18,
          });
        };

        const handleMouseEnter = () => {
          if (soundEnabled) playSoundEffect("hover");
        };

        const handleMouseLeave = () => {
          setTransform(
            "perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)",
          );
          setGlarePos((prev) => ({ ...prev, opacity: 0 }));
        };

        return (
          <div
            ref={cardRef}
            onMouseMove={handleMouseMove}
            onMouseEnter={handleMouseEnter}
            onMouseLeave={handleMouseLeave}
            style={{ transform, transition: "transform 0.15s ease-out" }}
            className={`glass-card rounded-2xl relative overflow-hidden ${className}`}
          >
            <div
              className="pointer-events-none absolute inset-0 z-10 transition-opacity duration-300"
              style={{
                background: `radial-gradient(400px circle at ${glarePos.x}% ${glarePos.y}%, rgba(255,255,255,${glarePos.opacity}), transparent 80%)`,
              }}
            />
            <div className="relative z-20">{children}</div>
          </div>
        );
      }

      function InteractiveTerminal({ soundEnabled }) {
        const [input, setInput] = React.useState("");
        const [history, setHistory] = React.useState([
          { type: "system", text: "Initializing Mahee OS Terminal v2.4..." },
          {
            type: "system",
            text: "Connected to International Islamic University Chittagong node.",
          },
          { type: "info", text: 'Type "help" to view available commands.' },
        ]);

        const handleCommand = (e) => {
          if (e.key === "Enter") {
            if (soundEnabled) playSoundEffect("click");
            const cmd = input.trim().toLowerCase();
            const newHist = [...history, { type: "user", text: `$ ${input}` }];

            if (cmd === "help") {
              newHist.push({
                type: "response",
                text: "Available commands:\n • help : Show command options\n • about : Display biography\n • skills : List core programming skills\n • cp : Show Codeforces profile\n • contact : Get email & phone\n • clear : Clear terminal window",
              });
            } else if (cmd === "about") {
              newHist.push({
                type: "response",
                text: `${PORTFOLIO_DATA.fullName}\n${PORTFOLIO_DATA.degree} @ IIUC.\nPassionate about algorithms, C++, Java, and software development.`,
              });
            } else if (cmd === "skills") {
              newHist.push({
                type: "response",
                text: "C++ (STL) • Java (OOP) • Data Structures & Algorithms • Competitive Programming • HTML5/CSS3/JS",
              });
            } else if (cmd === "cp") {
              newHist.push({
                type: "response",
                text: `Codeforces Handle: @${PORTFOLIO_DATA.socials.codeforces.username}\nURL: ${PORTFOLIO_DATA.socials.codeforces.url}`,
              });
            } else if (cmd === "contact") {
              newHist.push({
                type: "response",
                text: `Email: ${PORTFOLIO_DATA.email}\nPhone: ${PORTFOLIO_DATA.phone}\nLocation: ${PORTFOLIO_DATA.location}`,
              });
            } else if (cmd === "clear") {
              setHistory([]);
              setInput("");
              return;
            } else if (cmd !== "") {
              newHist.push({
                type: "error",
                text: `Command not recognized: "${cmd}". Type "help" for valid commands.`,
              });
            }

            setHistory(newHist);
            setInput("");
          }
        };

        return (
          <div className="w-full rounded-2xl bg-[#080512] border border-purple-900/60 shadow-2xl overflow-hidden font-mono text-xs">

                            </span>
                          </p>
                        </div>
                      </div>
                      <span className="px-2.5 py-1 rounded-full bg-purple-900/40 border border-purple-700/40 text-purple-300 text-[11px] font-mono">
                        Active Contested
                      </span>
                    </div>

                    <p className="text-xs text-gray-300 leading-relaxed">
                      Check out my latest submissions, solved problems, contest
                      history, and competitive programming statistics directly
                      on Codeforces.
                    </p>

                    <a
                      href={PORTFOLIO_DATA.socials.codeforces.url}
                      target="_blank"
                      rel="noreferrer"
                      className="purple-gradient-btn inline-flex items-center justify-center w-full py-3.5 rounded-xl text-white text-xs font-bold shadow-lg shadow-purple-600/30 gap-2"
                    >
                      <span>Visit Codeforces Profile</span>
                      <i data-lucide="external-link" class="w-4 h-4"></i>
                    </a>
                  </TiltCard>
                </div>
              </div>
            </section>

            {/* FEATURED PROJECTS */}
            {}
            <section
              id="projects"
              className="relative z-10 py-20 max-w-7xl mx-auto px-6 border-t border-purple-900/20 reveal-element"
            >
              <div className="space-y-12">
                <div className="space-y-2">
                  <div className="text-xs font-mono text-purple-400 uppercase tracking-widest">
                    Portfolio Showcase
                  </div>
                  <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-gradient">
                    Featured Projects
                  </h2>
                  <p className="text-gray-400 text-sm">
                    Selected software engineering projects, academic
                    implementations, and web utilities.
                  </p>
                </div>

                <div className="grid md:grid-cols-3 gap-8">
                  {PORTFOLIO_DATA.projects.map((proj) => (
                    <TiltCard
                      key={proj.id}
                      className="p-6 flex flex-col justify-between space-y-6"
                      soundEnabled={soundEnabled}
                    >
                      <div className="space-y-4">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-mono font-bold text-purple-400">
                            PROJECT {proj.id}
                          </span>
                          <span className="text-[10px] font-mono bg-purple-950/80 border border-purple-800/40 text-purple-300 px-2.5 py-0.5 rounded-full">
                            {proj.status}
                          </span>
                        </div>
                        <h3 className="text-xl font-extrabold text-white group-hover:text-purple-300 transition-colors">
                          {proj.title}
                        </h3>
                        <p className="text-xs text-gray-300 leading-relaxed">
                          {proj.description}
                        </p>
                      </div>

                      <div className="space-y-4">
                        <div className="flex flex-wrap gap-1.5">
                          {proj.technologies.map((tech) => (
                            <span
                              key={tech}
                              className="text-[10px] font-mono bg-purple-950/60 border border-purple-800/40 text-purple-200 px-2.5 py-1 rounded-md"
                            >
                              {tech}
                            </span>
                          ))}
                        </div>

                        <div className="pt-3 border-t border-purple-900/30 flex items-center justify-between">
                          <a
                            href={proj.githubUrl}
                            target="_blank"
                            rel="noreferrer"
                            className="text-xs text-purple-300 hover:text-white flex items-center gap-1.5 font-mono transition-colors font-semibold"
                          >
                            <i data-lucide="github" class="w-4 h-4"></i> View
                            Repository
                          </a>
                        </div>
                      </div>
                    </TiltCard>
                  ))}
                </div>
              </div>
            </section>

            {/* JOURNEY & TIMELINE */}
            {}
            <section className="relative z-10 py-20 max-w-7xl mx-auto px-6 border-t border-purple-900/20 reveal-element">
              <div className="space-y-12">
                <div className="space-y-2">
                  <div className="text-xs font-mono text-purple-400 uppercase tracking-widest">
                    Roadmap
                  </div>
                  <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-gradient">
                    Academic & Coding Journey
                  </h2>
                  <p className="text-gray-400 text-sm">
                    Key milestones in my technical growth as a CSE student.
                  </p>
                </div>

                <div className="relative border-l-2 border-purple-900/60 ml-4 space-y-8 pl-8">
                  {PORTFOLIO_DATA.journeySteps.map((item) => (
                    <div key={item.step} className="relative group">
                      <span className="absolute -left-[41px] top-1 w-4 h-4 rounded-full bg-[#040308] border-2 border-[#7C3AED] group-hover:bg-[#A855F7] group-hover:scale-125 transition-all shadow-md shadow-purple-600/50"></span>
                      <h3 className="text-base font-bold text-white flex items-center gap-2">
                        <span className="text-xs font-mono text-purple-400 font-bold">
                          [{item.step}]
                        </span>{" "}
                        {item.title}
                      </h3>
                      <p className="text-xs text-gray-300 mt-1 leading-relaxed">
                        {item.detail}
                      </p>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* CONTACT SECTION */}
            {}
            <section
              id="contact"
              className="relative z-10 py-20 max-w-7xl mx-auto px-6 border-t border-purple-900/20 reveal-element"
            >
              <div className="grid md:grid-cols-12 gap-12">
                <div className="md:col-span-5 space-y-6">
                  <div className="text-xs font-mono text-purple-400 uppercase tracking-widest">
                    Get In Touch
                  </div>
                  <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-gradient">
                    Let's Connect & Collaborate
                  </h2>
                  <p className="text-gray-300 text-sm leading-relaxed">
                    I am always interested in discussing computer science
                    topics, algorithm strategies, web development, and software
                    opportunities.
                  </p>

                  <div className="space-y-3 font-mono text-xs text-gray-300">
                    <TiltCard
                      className="p-4 flex items-center justify-between"
                      soundEnabled={soundEnabled}
                    >
                      <span className="text-gray-400 flex items-center gap-2">
                        <i
                          data-lucide="mail"
                          class="w-4 h-4 text-purple-400"
                        ></i>{" "}
                        Email
                      </span>
                      <button
                        onClick={() =>
                          copyToClipboard(PORTFOLIO_DATA.email, "email")
                        }
                        className="text-purple-300 hover:text-white font-semibold transition-colors"
                      >
                        {copiedField === "email"
                          ? "Copied to Clipboard!"
                          : PORTFOLIO_DATA.email}
                      </button>
                    </TiltCard>

                    <TiltCard
                      className="p-4 flex items-center justify-between"
                      soundEnabled={soundEnabled}
                    >
                      <span className="text-gray-400 flex items-center gap-2">
                        <i
                          data-lucide="phone"
                          class="w-4 h-4 text-purple-400"
                        ></i>{" "}
                        Phone
                      </span>
                      <button
                        onClick={() =>
                          copyToClipboard(PORTFOLIO_DATA.phone, "phone")
                        }
                        className="text-purple-300 hover:text-white font-semibold transition-colors"
                      >
                        {copiedField === "phone"
                          ? "Copied to Clipboard!"
                          : PORTFOLIO_DATA.phone}
                      </button>
                    </TiltCard>

                    <TiltCard
                      className="p-4 flex items-center justify-between"
                      soundEnabled={soundEnabled}
                    >
                      <span className="text-gray-400 flex items-center gap-2">
                        <i
                          data-lucide="github"
                          class="w-4 h-4 text-purple-400"
                        ></i>{" "}
                        GitHub
                      </span>
                      <a
                        href={PORTFOLIO_DATA.socials.github.url}
                        target="_blank"
                        rel="noreferrer"
                        className="text-purple-300 hover:text-white transition-colors"
                      >
                        @{PORTFOLIO_DATA.socials.github.username}
                      </a>
                    </TiltCard>

                    <TiltCard
                      className="p-4 flex items-center justify-between"
                      soundEnabled={soundEnabled}
                    >
                      <span className="text-gray-400 flex items-center gap-2">
                        <i
                          data-lucide="map-pin"
                          class="w-4 h-4 text-purple-400"
                        ></i>{" "}
                        Location
                      </span>
                      <span className="text-gray-200">
                        {PORTFOLIO_DATA.location}
                      </span>
                    </TiltCard>
                  </div>
                </div>

                <div className="md:col-span-7">
                  <TiltCard
                    className="p-8 space-y-4"
                    soundEnabled={soundEnabled}
                  >
                    {formSubmitted && (
                      <div className="p-4 rounded-xl bg-purple-950/80 border border-purple-600 text-purple-200 text-xs font-mono text-center shadow-lg">
                        ✓ Message received! Thank you for connecting with{" "}
                        {PORTFOLIO_DATA.fullName}.
                      </div>
                    )}

                    <form onSubmit={handleFormSubmit} className="space-y-4">
                      <div className="space-y-1">
                        <label className="text-xs font-mono text-gray-300">
                          Your Full Name
                        </label>
                        <input
                          type="text"
                          required
                          value={formState.name}
                          onChange={(e) =>
                            setFormState({ ...formState, name: e.target.value })
                          }
                          placeholder="e.g. Alex Johnson"
                          className="w-full px-4 py-3 rounded-xl bg-[#040308] border border-purple-900/50 text-sm text-white focus:outline-none focus:border-purple-500 transition-colors"
                        />
                      </div>

                      <div className="space-y-1">
                        <label className="text-xs font-mono text-gray-300">
                          Your Email Address
                        </label>
                        <input
                          type="email"
                          required
                          value={formState.email}
                          onChange={(e) =>
                            setFormState({
                              ...formState,
                              email: e.target.value,
                            })
                          }
                          placeholder="alex@example.com"
                          className="w-full px-4 py-3 rounded-xl bg-[#040308] border border-purple-900/50 text-sm text-white focus:outline-none focus:border-purple-500 transition-colors"
                        />
                      </div>

                      <div className="space-y-1">
                        <label className="text-xs font-mono text-gray-300">
                          Message
                        </label>
                        <textarea
                          rows="4"
                          required
                          value={formState.message}
                          onChange={(e) =>
                            setFormState({
                              ...formState,
                              message: e.target.value,
                            })
                          }
                          placeholder="Hello Shahriar, I would like to connect with you regarding..."
                          className="w-full px-4 py-3 rounded-xl bg-[#040308] border border-purple-900/50 text-sm text-white focus:outline-none focus:border-purple-500 transition-colors"
                        ></textarea>
                      </div>

                      <button
                        type="submit"
                        className="purple-gradient-btn w-full py-3.5 rounded-xl text-white text-xs font-bold shadow-lg shadow-purple-600/30 flex items-center justify-center gap-2"
                      >
                        <span>Send Direct Message</span>
                        <i data-lucide="send" class="w-4 h-4"></i>
                      </button>
                    </form>
                  </TiltCard>
                </div>
              </div>
            </section>

            {/* FOOTER */}
            {}
            <footer className="relative z-10 py-12 border-t border-purple-900/30 bg-[#040308] text-xs text-gray-400">
              <div className="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-6">
                <div>
                  <span className="font-extrabold text-gray-200 text-sm">
                    {PORTFOLIO_DATA.fullName}
                  </span>
                  <p className="text-[11px] text-gray-400 mt-0.5">
                    {PORTFOLIO_DATA.roleHeadline}
                  </p>
                </div>

                <p className="font-mono text-[11px] text-gray-400">
                  © 2026 {PORTFOLIO_DATA.fullName}. Engineered with code &
                  motion.
                </p>
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
